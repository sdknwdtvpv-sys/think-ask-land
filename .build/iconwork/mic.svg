<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 140" width="840" height="280">
  <rect width="420" height="140" fill="#fffaf0"/>
  <g fill="none" stroke="#3a3550" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- A: 胶囊 + 弧形支架 + 立杆（标准话筒） -->
    <g transform="translate(14,14) scale(4)">
      <rect x="9.2" y="3.4" width="5.6" height="10.4" rx="2.8"/>
      <path d="M5.8 11.6a6.2 6.2 0 0 1 12.4 0"/>
      <path d="M12 17.8v2.8"/>
    </g>
    <!-- B: 同上 + 底座横线 -->
    <g transform="translate(154,14) scale(4)">
      <rect x="9.2" y="3" width="5.6" height="10.4" rx="2.8"/>
      <path d="M5.8 11.2a6.2 6.2 0 0 1 12.4 0"/>
      <path d="M12 17.4v2.4"/>
      <path d="M8.4 20.6h7.2"/>
