  <g font-family="PingFang SC" font-size="13" fill="#6b6580">
    <text x="62" y="132">A 标准话筒</text>
    <text x="202" y="132">B 带底座</text>
    <text x="342" y="132">C 现有喇叭（风格基准）</text>
  </g>
