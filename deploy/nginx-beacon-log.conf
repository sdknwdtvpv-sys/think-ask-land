# 思问岛 · 匿名埋点日志格式
# 安装位置:/etc/nginx/conf.d/beacon-log.conf  (必须是 http 上下文,所以不能放进站点配置)
#   sudo cp deploy/nginx-beacon-log.conf /etc/nginx/conf.d/beacon-log.conf
#
# 隐私设计:刻意**不记录 IP 与 User-Agent**,只留事件名/属性/版本/匿名标识四列,
# 因此日志里无法定位到任何具体设备或人。

log_format beacon '$time_iso8601 $arg_e $arg_p $arg_v $arg_s';
