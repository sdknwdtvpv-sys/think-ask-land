# 思问岛 · nginx 站点配置
# 放置位置(二选一,腾讯云 Linux 常见):
#   /etc/nginx/conf.d/hanzi-kids.conf        (CentOS/TencentOS 系)
#   /etc/nginx/sites-enabled/hanzi-kids.conf (Ubuntu/Debian 系,需软链到 sites-enabled)
# 生效: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;

    # 没有域名就用 _ ;有域名改成 server_name your.domain.com;
    server_name _;

    root /var/www/hanzi-kids;
    index index.html;

    charset utf-8;
    access_log /var/log/nginx/hanzi-kids.access.log;
    error_log  /var/log/nginx/hanzi-kids.error.log;

    # gzip 压缩(字体/文本类收益明显)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml font/woff2 application/manifest+json;

    # 静态资源长缓存(文件名不含指纹,先给 7 天,更新后会自动过期)
    location ~* \.(?:woff2|svg|png|jpe?g|gif|ico|js|css)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # HTML 不缓存,保证发新版刷新即生效
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 预置朗读音频:文件名带内容哈希,可长缓存;缺失必须 404
    # (否则会回落到 location / 返回 index.html,把"文件缺失"伪装成 200)
    location ~* \.mp3$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
        access_log off;
    }

    # 字库/笔顺数据较大(700KB),单独给一点缓存并允许预压缩
    location = /data/strokes.js {
        expires 30d;
        add_header Cache-Control "public";
    }

    # SPA 兜底:任何路径都回到 index.html(本项目用 hash 路由,实际很少用到)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

