# 思问岛 · 独立子域名站点配置
# 服务器: 118.25.45.88 (Ubuntu 24.04 / nginx 1.24)
# 目标地址: https://hanzi.elliotli.work
# 说明: 本文件是独立站点,不改动 teacher-dashboard(班主任管理后台)的任何配置。
# 安装: sudo cp 本文件 /etc/nginx/sites-available/hanzi-kids
#       sudo ln -sf /etc/nginx/sites-available/hanzi-kids /etc/nginx/sites-enabled/hanzi-kids
#       sudo nginx -t && sudo systemctl reload nginx
# HTTPS: sudo certbot --nginx -d hanzi.elliotli.work --redirect（自动改写本文件）

server {
    listen 80;
    listen [::]:80;
    server_name hanzi.elliotli.work;

    root /var/www/hanzi-kids;
    index index.html;

    charset utf-8;
    access_log /var/log/nginx/hanzi-kids.access.log;
    error_log  /var/log/nginx/hanzi-kids.error.log;

    client_max_body_size 8M;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml font/woff2 application/manifest+json;

    # 静态资源缓存(JS/CSS/字体/图片)
    location ~* \.(?:woff2|svg|png|jpe?g|gif|ico|js|css)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 笔顺数据 700KB,单独长缓存
    location = /data/strokes.js {
        expires 30d;
        add_header Cache-Control "public";
    }

    # HTML 不缓存:发新版刷新即生效
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
