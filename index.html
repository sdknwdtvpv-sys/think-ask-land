<!DOCTYPE html>
<!-- 静态就带上 v4 类：App.render 会在 JS 启动后才按屏切换它，
     但**首帧**是 CSS 渲染的、那时 JS 还没跑 —— 于是在旧主题下先画一帧
     （旧天蓝背景 + 紫灰文字），冷启动能看到一闪。
     16 屏已全部迁到 v4，所以这里直接写死，首帧就是新主题。
     （App.render 仍会按屏切换，行为不变。） -->
<html lang="zh-CN" class="v4">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>思问岛 · 幼儿识字启蒙</title>
<meta name="description" content="思问岛 · 专为 3-6 岁小朋友设计的幼儿识字 H5 应用：字卡学习、笔顺描红、趣味练习、间隔复习与奖励系统。陪着孩子，一起把问题变成答案。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="思问岛">
<meta name="app-version" content="2.12.0">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FBF8F1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<script>/* 启动即应用减少动效偏好，避免动画闪烁。
   这一个键**故意**读 localStorage 而不是 PlatformStorage:后者在原生壳里是异步的，
   读不到就会闪一下;而它只是可重设的 UI 偏好，不是学习进度。见 views2.js 的同一处注释。 */
try{if(localStorage.getItem("hanziKids.reduceMotion")==="1")document.documentElement.className+=" reduce-motion";}catch(e){}</script>
<link rel="stylesheet" href="css/tokens.css?v=2.12.0">
<link rel="stylesheet" href="css/style.css?v=2.12.0">
<link rel="stylesheet" href="css/style2.css?v=2.12.0">
<link rel="stylesheet" href="css/v2.css?v=2.12.0">
<link rel="stylesheet" href="css/v4.css?v=2.12.0">
</head>
<body>
<div id="scene" aria-hidden="true">
  <div class="sc-sun"></div>
  <div class="sc-cloud c1"></div>
  <div class="sc-cloud c2"></div>
  <div class="sc-cloud c3"></div>
  <div class="sc-hill h1"></div>
  <div class="sc-hill h2"></div>
  <div class="sc-hill h3"></div>
</div>
<div id="app">
  <header id="topbar">
    <button id="btn-back" class="icon-btn" aria-label="返回">‹</button>
    <div id="page-title">思问岛</div>
    <button id="btn-parent" class="icon-btn topbar-parent" aria-label="家长中心" title="家长中心">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/><path d="M4 20c0-3.3 3.6-5.5 8-5.5s8 2.2 8 5.5"/></svg>
    </button>
    <div id="star-pill" class="star-pill"><span class="star-icon"><svg viewBox="0 0 24 24" fill="#D9A227" stroke="#C08A1E" stroke-width="1.2" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.9l2.9 5.9 6.5 1-4.7 4.5 1.1 6.5L12 17.7l-5.8 3.1 1.1-6.5L2.6 9.8l6.5-1z"/></svg></span><span id="star-count">0</span></div>
  </header>
  <main id="view"></main>
  <!-- 底部主导航。由 js/app.js 的 TABS 渲染（数据驱动，改 tab 只动那一个数组）。 -->
  <nav id="tabbar" class="tabbar" hidden aria-label="主导航"></nav>
  <!-- 长页面（家长中心约 5 屏、地图 16 岛、字表 51 格）的回顶按钮。
       只在滚过一屏后出现，且只在有 tab bar 的屏上出现（沉浸屏不打扰）。 -->
  <button id="to-top" class="to-top" hidden aria-label="回到顶部">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
  </button>
</div>
